name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B clean verify
        working-directory: backend
      - name: Require PostgreSQL integration tests to execute
        shell: pwsh
        run: |
          [xml]$report = Get-Content backend/target/surefire-reports/TEST-com.patientmanagement.integration.CoreSchemaIntegrationTests.xml
          if ([int]$report.testsuite.skipped -ne 0 -or [int]$report.testsuite.tests -lt 7) { throw "Database integration not verified" }
      - run: mvn -B dependency:tree -DoutputType=json -DoutputFile=target/dependency-tree.json
        working-directory: backend
      - shell: pwsh
        run: ./scripts/dependency-audit.ps1
      - shell: pwsh
        run: ./scripts/check-release.ps1 -RequireTracked
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /
      - run: npm audit --audit-level=moderate
        working-directory: frontend
