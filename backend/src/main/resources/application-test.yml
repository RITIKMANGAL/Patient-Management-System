spring:
  config:
    activate:
      on-profile: test
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  autoconfigure:
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

security:
  abuse-control:
    enabled: false
  jwt:
    secret: test-only-jwt-secret-for-automated-tests-at-least-32-bytes
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
  cors:
    allowed-origins: http://localhost:5173

communication:
  sms:
    enabled: true
    provider: noop
    sender: PMCLINIC
    timeout-seconds: 5
    templates:
      appointment-confirmation:
      appointment-reminder:
      consultation-completed:
      prescription-available:
      feedback-request:
  appointment-reminders:
    enabled: false
    look-ahead-hours: 24
    fixed-delay-ms: 900000
    initial-delay-ms: 60000

ai:
  enabled: true
  provider: mock
  model: test-mock-clinical-assistant-v1
  timeout-seconds: 5
  api-key:
  base-url: https://api.openai.com/v1/chat/completions

prescription:
  access:
    token-expiration-hours: 168

feedback:
  access:
    token-expiration-hours: 168
    public-base-url: http://localhost:5173

demo:
  data:
    enabled: false
    password: test-only-demo-password
