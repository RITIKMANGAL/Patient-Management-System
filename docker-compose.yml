services:
  postgres:
    image: postgres:18-alpine
    container_name: patient-management-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patient_management}
      POSTGRES_USER: ${DATABASE_USERNAME:-patient_management}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-patient_management_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patient-management-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/patient_management}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-patient_management}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-patient_management_local_password}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-shared-use-32-bytes}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  postgres_data:
