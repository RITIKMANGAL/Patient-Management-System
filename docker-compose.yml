services:
  postgres:
    image: postgres:18-alpine
    container_name: patient-management-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patient_management}
      POSTGRES_USER: ${DATABASE_USERNAME:-patient_management}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env or the shell environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patient-management-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      CLINIC_TIME_ZONE: ${CLINIC_TIME_ZONE:-UTC}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/patient_management}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-patient_management}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env or the shell environment}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env or the shell environment}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FRONTEND_API_URL: ${FRONTEND_API_URL:-http://localhost:5173}
      APPOINTMENT_REMINDERS_ENABLED: ${APPOINTMENT_REMINDERS_ENABLED:-true}
      APPOINTMENT_REMINDER_LOOK_AHEAD_HOURS: ${APPOINTMENT_REMINDER_LOOK_AHEAD_HOURS:-24}
      APPOINTMENT_REMINDER_FIXED_DELAY_MS: ${APPOINTMENT_REMINDER_FIXED_DELAY_MS:-900000}
      APPOINTMENT_REMINDER_INITIAL_DELAY_MS: ${APPOINTMENT_REMINDER_INITIAL_DELAY_MS:-60000}
      SMS_ENABLED: ${SMS_ENABLED:-true}
      SMS_PROVIDER: ${SMS_PROVIDER:-noop}
      SMS_SENDER: ${SMS_SENDER:-PMCLINIC}
      SMS_TIMEOUT_SECONDS: ${SMS_TIMEOUT_SECONDS:-15}
      SMS_TEMPLATE_APPOINTMENT_CONFIRMATION: ${SMS_TEMPLATE_APPOINTMENT_CONFIRMATION:-}
      SMS_TEMPLATE_APPOINTMENT_REMINDER: ${SMS_TEMPLATE_APPOINTMENT_REMINDER:-}
      SMS_TEMPLATE_CONSULTATION_COMPLETED: ${SMS_TEMPLATE_CONSULTATION_COMPLETED:-}
      SMS_TEMPLATE_PRESCRIPTION_AVAILABLE: ${SMS_TEMPLATE_PRESCRIPTION_AVAILABLE:-}
      SMS_TEMPLATE_FEEDBACK_REQUEST: ${SMS_TEMPLATE_FEEDBACK_REQUEST:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-mock-clinical-assistant-v1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-15}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1/chat/completions}
      FEEDBACK_ACCESS_TOKEN_EXPIRATION_HOURS: ${FEEDBACK_ACCESS_TOKEN_EXPIRATION_HOURS:-168}
      FEEDBACK_PUBLIC_BASE_URL: ${FEEDBACK_PUBLIC_BASE_URL:-http://localhost:5173}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
      DEMO_DATA_PASSWORD: ${DEMO_DATA_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  postgres_data:
